name: Build and Publish DSX

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            build_script: npm run dist:win
            artifact_name: DSX-Windows-x64
            artifact_path: release/DSX-*.exe

          - platform: macos
            os: macos-latest
            build_script: npm run dist:mac
            artifact_name: DSX-macOS-x64
            artifact_path: release/DSX-*.dmg

          - platform: linux
            os: ubuntu-latest
            build_script: npm run dist:linux
            artifact_name: DSX-Linux-x64
            artifact_path: |
              release/DSX-*.deb
              release/DSX-*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify package version and critical app files
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const pkg = require('./package.json');
            if (pkg.version !== '1.4.0') {
              console.error('Expected package.json version 1.4.0, got', pkg.version);
              process.exit(1);
            }
            if (pkg.build.productName !== 'DSX') {
              console.error('Expected productName DSX, got', pkg.build.productName);
              process.exit(1);
            }
            const required = [
              'main.js',
              'preload.js',
              'Frontend/src/index.html',
              'Frontend/src/settings/perfSettings.js',
              'Frontend/src/js/connectionPrefetch.js',
              'Frontend/src/shortcuts/actions/navigation-controls/index.js',
              'Frontend/Telas/Atalhos/Atalhos.js',
              'Frontend/Telas/Atalhos/Atalhos.html',
              'Frontend/Telas/Atalhos/Atalhos.css',
              'Frontend/Telas/Editar/Editar.js',
              'Frontend/Telas/Editar/Editar.html',
              'Frontend/MiniTelas/MiniAtalhos/MiniAtalhos.js',
              'Frontend/src/Browser/Browser.css',
              'Frontend/src/Tabs/Tabs.core.js',
              'Frontend/src/Tabs/TabWarmth.js',
              'Frontend/src/Tabs/TabGroups.runtime.js',
              'Frontend/src/core/AppShell.js',
              'Frontend/src/Janelas/index.js',
              'Frontend/src/Janelas/animations/AnimationHook.js',
              'Frontend/src/Janelas/split/SplitHost.js',
              'Frontend/src/Janelas/effects/RgbClock.js',
              'Frontend/src/search/SmartSearch.js',
              'Backend/API-DSX/boot.js',
              'Backend/API-DSX/app.js',
              'Version/Lançamento/Log v1.4.MD',
            ];
            const missing = required.filter((f) => !fs.existsSync(path.join(process.cwd(), f)));
            if (missing.length) {
              console.error('Missing build-critical files:', missing.join(', '));
              process.exit(1);
            }
            console.log('DSX v' + pkg.version + ' — productName=' + pkg.build.productName);
            console.log('Critical files OK (' + required.length + ')');
          "

      - name: Prepare platform icons from Image/Icons
        run: npm run icons:prepare

      - name: Build application
        run: ${{ matrix.build_script }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version
        id: pkg
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}-build.${{ github.run_number }}
          name: DSX v${{ steps.pkg.outputs.version }} Beta (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: true
          body: |
            ## DSX v${{ steps.pkg.outputs.version }} Beta

            Instaladores: `DSX-${{ steps.pkg.outputs.version }}-*`

            Changelog: `Version/Lançamento/Log v1.4.MD`
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
