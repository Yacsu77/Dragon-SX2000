<div class="cofre-screen" data-role="cofre-screen">
  <header class="cofre-screen__header">
    <h1 class="cofre-screen__title">Gerenciador de Senhas</h1>
    <button type="button" class="cofre-screen__close" data-role="close" aria-label="Fechar">×</button>
  </header>
  <div class="cofre-screen__body">
    <section class="cofre-screen__locked" data-role="locked-panel">
      <p class="cofre-screen__status">Trancado</p>
      <p class="cofre-screen__hint" data-role="locked-hint">
        As senhas são usadas automaticamente nos sites. Este painel apenas lista os sites salvos.
      </p>
      <h2 class="cofre-screen__subtitle">Sites salvos</h2>
      <ul class="cofre-screen__list" data-role="list"></ul>
      <p class="cofre-screen__empty" data-role="empty" hidden>Nenhum site salvo ainda.</p>
    </section>
  </div>
</div>
