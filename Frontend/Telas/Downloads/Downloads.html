<div class="downloads-screen" data-role="downloads-screen">
  <header class="downloads-screen__header">
    <h1 class="downloads-screen__title">Downloads</h1>
    <div class="downloads-screen__actions">
      <button type="button" class="downloads-screen__clear" data-role="clear">Limpar</button>
      <button type="button" class="downloads-screen__close" data-role="close" aria-label="Fechar">×</button>
    </div>
  </header>
  <div class="downloads-screen__body" data-role="body">
    <ul class="downloads-screen__list" data-role="list"></ul>
    <p class="downloads-screen__empty" data-role="empty" hidden>Nenhum download neste perfil.</p>
  </div>
</div>
