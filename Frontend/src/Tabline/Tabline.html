<aside class="side-dock" id="sideDock" aria-label="Barra lateral">
  <div class="side-dock__join" aria-hidden="true"></div>

  <div class="side-dock__body">
    <section class="side-section" data-section="tools" aria-label="Ferramentas">
      <div class="side-section__list" data-role="section-list"></div>
    </section>

    <section class="side-section" data-section="llm" aria-label="IA">
      <div class="side-section__list" data-role="section-list"></div>
    </section>

    <section class="side-section" data-section="chats" aria-label="Chats">
      <div class="side-section__list" data-role="section-list"></div>
    </section>

    <section class="side-section side-section--widgets" data-section="widgets" aria-label="Widgets">
      <div class="widgets-orb-wrap">
        <button
          type="button"
          class="widgets-orb"
          id="widgetsOrb"
          aria-label="Widgets"
          aria-expanded="false"
          aria-haspopup="true"
          title="Widgets"
        >
          <span class="widgets-orb__ring" aria-hidden="true"></span>
          <span class="widgets-orb__core" aria-hidden="true"></span>
        </button>

        <div class="widgets-flyout" id="widgetsFlyout" hidden>
          <a class="side-item" data-widget="wallpaper" href="#wallpaper-widget" aria-label="Wallpaper" title="Wallpaper">
            <span class="side-item__icon" data-lucide="image"></span>
          </a>
          <button type="button" class="side-item side-item--theme" id="temaTabBtn" data-widget="tema" aria-label="Tema" title="Tema">
            <span class="theme-toggler-viewport" aria-hidden="true">
              <span class="theme-toggler-strip" id="themeTogglerStrip" data-index="0">
                <span class="theme-toggler-slot">
                  <svg class="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                  </svg>
                </span>
                <span class="theme-toggler-slot">
                  <svg class="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                  </svg>
                </span>
                <span class="theme-toggler-slot">
                  <svg class="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                    <path d="M8 21h8M12 17v4"></path>
                  </svg>
                </span>
              </span>
            </span>
          </button>
          <a class="side-item" data-widget="customise" href="#customise-widget" aria-label="Customise" title="Customise">
            <span class="side-item__icon" data-lucide="sliders"></span>
          </a>
          <button type="button" class="side-item" data-widget="donate" aria-label="Donate" title="Donate">
            <span class="side-item__icon" data-lucide="heart"></span>
          </button>
          <a class="side-item" data-widget="autotune" href="#autotune-widget" aria-label="AutoTune" title="AutoTune">
            <span class="side-item__icon" data-lucide="sparkles"></span>
          </a>
        </div>
      </div>
    </section>

    <div class="side-dock__spacer" aria-hidden="true"></div>

    <section class="side-section side-section--footer" data-section="footer" aria-label="Conta">
      <div class="side-media-wrap" id="sideMediaWrap" hidden>
        <button type="button" class="side-media" id="sideMediaHint" aria-label="Mídia" title="Mídia">
          <span class="side-media__eq" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
        </button>
        <div class="side-media-flyout" id="sideMediaFlyout" hidden>
          <div class="side-media-flyout__controls">
            <button type="button" data-media-action="prev" title="Anterior" aria-label="Anterior">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
            </button>
            <button type="button" data-media-action="play_pause" title="Play/Pause" aria-label="Play/Pause" data-role="media-play-btn">
              <svg data-icon="play" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg data-icon="pause" viewBox="0 0 24 24" width="12" height="12" fill="currentColor" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>
            <button type="button" data-media-action="next" title="Próxima" aria-label="Próxima">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <button type="button" class="side-sync" id="sideSyncBtn" aria-label="Sincronização" title="Sincronizando…">
        <span class="side-sync__icon" data-lucide="cloud"></span>
        <span class="side-sync__pulse" aria-hidden="true"></span>
      </button>

      <div class="side-profile-wrap">
        <button type="button" class="side-profile" id="sideProfileBtn" aria-label="Perfil" aria-expanded="false" aria-haspopup="true">
          <span class="side-profile__avatar" data-role="avatar">?</span>
        </button>
        <div class="side-profile-flyout" id="sideProfileFlyout" hidden>
          <button type="button" class="side-profile-flyout__btn" data-profile-action="edit">Editar</button>
          <button type="button" class="side-profile-flyout__btn" data-profile-action="switch">Trocar de conta</button>
        </div>
      </div>
    </section>
  </div>

  <span class="side-tooltip" id="sideTooltip" aria-hidden="true"></span>
</aside>
