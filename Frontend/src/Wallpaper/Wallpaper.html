<div id="wallpaper-widget" class="wallpaper-overlay" aria-hidden="true">
  <div class="wallpaper-shell wallpaper-widget" role="dialog" aria-modal="true" aria-labelledby="wallpaperWidgetTitle">
    <a class="wallpaper-close" href="#" aria-label="Fechar">×</a>
    <main class="widget">
      <header class="widget-header">
        <h1 id="wallpaperWidgetTitle" data-i18n="wallpaper.titulo">Wallpaper</h1>
        <p data-i18n="wallpaper.subtitulo">Escolha e ajuste o wallpaper do ambiente.</p>
      </header>

      <section class="wallpaper-panel">
        <div class="wallpaper-preview" id="wallpaperPreview">
          <div class="preview-layer" id="previewLayer">
            <span class="preview-placeholder" data-i18n="wallpaper.selecione">Selecione uma imagem ou video</span>
          </div>
        </div>

        <div class="wallpaper-controls">
          <div class="wallpaper-actions">
            <label class="upload-btn">
              <span data-i18n="wallpaper.subirImagem">Subir imagem</span>
              <input id="wallpaperImageInput" type="file" accept="image/*" hidden />
            </label>
            <label class="upload-btn secondary">
              <span data-i18n="wallpaper.subirVideo">Subir video</span>
              <input id="wallpaperVideoInput" type="file" accept="video/*" hidden />
            </label>
          </div>

          <div class="adjustments">
            <div class="adjustment-row">
              <label for="rotateControl" data-i18n="wallpaper.rotacao">Rotacao</label>
              <input id="rotateControl" type="range" min="-180" max="180" value="0" />
            </div>
            <div class="adjustment-row buttons">
              <button class="control-btn" id="flipHorizontal" type="button" data-i18n="wallpaper.inverterX">Inverter X</button>
              <button class="control-btn" id="flipVertical" type="button" data-i18n="wallpaper.inverterY">Inverter Y</button>
              <button class="control-btn ghost" id="resetAdjustments" type="button" data-i18n="wallpaper.resetar">Resetar</button>
            </div>
            <p class="hint" data-i18n="wallpaper.arraste">Arraste no preview para mover o wallpaper.</p>
          </div>

          <div class="apply-row">
            <button class="apply-btn" id="applyWallpaper" type="button" data-i18n="wallpaper.aplicar">Aplicar</button>
            <span class="status" id="wallpaperStatus" aria-live="polite"></span>
          </div>
        </div>
      </section>

      <section class="wallpaper-recommended" aria-label="Recomendados" data-i18n-aria="wallpaper.recomendados">
        <h2 data-i18n="wallpaper.recomendados">Recomendados</h2>
        <p data-i18n="wallpaper.recomendadosDica">Sugestões empacotadas com o DSX — escolha uma ou deixe o padrão aleatório do perfil.</p>
        <div class="wallpaper-recommended-grid" id="wallpaperRecommended"></div>
      </section>
    </main>
  </div>
</div>
