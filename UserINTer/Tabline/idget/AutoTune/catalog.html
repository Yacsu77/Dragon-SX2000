<div id="autotune-widget" class="autotune-shelf" aria-hidden="true">
  <a class="autotune-close" href="#" aria-label="Fechar" data-i18n-aria="autotune.fechar">×</a>
  <h2 data-i18n="autotune.titulo">AutoTunes</h2>
  <p data-i18n="autotune.ajuda">Arraste um bloco para a grade. No modo de edição, o canto aumenta ou diminui o vão.</p>
  <div class="autotune-catalog">
    <div class="autotune-preview" draggable="true" data-autotune-preview="clock">
      <strong data-i18n="autotune.relogio">Relógio</strong>
      <span>6 × 3</span>
      <div class="autotune-preview-shape" data-shape="h2" aria-hidden="true"><i></i><i></i></div>
    </div>
    <div class="autotune-preview" draggable="true" data-autotune-preview="tasklist">
      <strong data-i18n="autotune.lista">Lista</strong>
      <span>3 × 6</span>
      <div class="autotune-preview-shape" data-shape="v2" aria-hidden="true"><i></i><i></i></div>
    </div>
    <div class="autotune-preview" draggable="true" data-autotune-preview="timer">
      <strong data-i18n="autotune.timer">Timer</strong>
      <span>3 × 3</span>
      <div class="autotune-preview-shape" data-shape="1" aria-hidden="true"><i></i></div>
    </div>
    <div class="autotune-preview" draggable="true" data-autotune-preview="share">
      <strong data-i18n="autotune.share">Share</strong>
      <span>3 × 3</span>
      <div class="autotune-preview-shape" data-shape="1" aria-hidden="true"><i></i></div>
    </div>
    <div class="autotune-preview" draggable="true" data-autotune-preview="music">
      <strong data-i18n="autotune.musica">Música</strong>
      <span>3 × 3</span>
      <div class="autotune-preview-shape" data-shape="1" aria-hidden="true"><i></i></div>
    </div>
  </div>
</div>
