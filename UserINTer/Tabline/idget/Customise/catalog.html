<div id="customise-widget" class="customise-overlay" aria-hidden="true">
  <div class="customise-shell">
    <button type="button" class="customise-close" data-customise-close="true" aria-label="Fechar">×</button>
    <h2>Customise</h2>
    <p>Personalize objetos da interface. Use a engrenagem para editar cada item — sem ligar/desligar, só configurar.</p>
    <div class="customise-catalog">
      <div class="customise-catalog-row">
        <div class="customise-row-text">
          <strong>Radial Menu</strong>
          <span>Menu circular (Alt / Option) com idgets da Tabline</span>
        </div>
        <button
          type="button"
          class="customise-row-factory-btn"
          data-open-customise-factory="true"
          data-customise-key="customise-radial-menu"
          data-customise-label="Radial Menu"
          title="Editar Radial Menu"
          aria-label="Editar Radial Menu"
        >⚙</button>
      </div>
    </div>
  </div>
</div>
